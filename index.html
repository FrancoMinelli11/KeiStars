<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Genera y descarga pósters conmemorativos con el mapa de las estrellas de una fecha y lugar cualquiera. Render 100% en cliente con d3-celestial."
    />
    <title>KeiStars · Pósters de mapa estelar</title>

    <!-- Icono autocontenido: evita la petición 404 a /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0f1f'/%3E%3Cpath d='M16 4.5l3 7.9 8.5 3.1-8.5 3.1-3 7.9-3-7.9L4.5 15.5 13 12.4z' fill='%23e8c478'/%3E%3C/svg%3E"
    />

    <!--
      Tipografías usadas tanto en la vista previa (DOM) como en el lienzo de
      exportación. `document.fonts.ready` se espera antes de pintar el PNG para
      que el texto exportado sea idéntico al de la vista previa.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Los scripts de d3 v3 + d3-celestial NO se declaran aquí: se cargan de
      forma asíncrona y secuencial dentro de `useEffect`
      (src/lib/celestialLoader.ts) con fallback automático a CDN. Esto evita
      que el bundler toque un IIFE diseñado para `window`.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
